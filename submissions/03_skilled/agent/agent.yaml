# 03_skilled — fixes the bug that almost certainly caused 01_baseline's 0.812.
#
# THE BUG. Local evaluation showed the agent spending its opening minutes on:
#     ls -F /skills/            -> error
#     ls -F /opt/ | grep skills -> error
#     find / -type d -name skills
#     find / -name tabular-automl -type d
# ...then giving up and writing its own train_model.py from scratch.
#
# Bundled skills are NOT materialised as a `skills/` directory in the sandbox.
# adk_submission wraps them in google.adk.tools.skill_toolset.SkillToolset,
# which exposes them as TOOLS: list_skills, load_skill, load_skill_resource,
# and run_skill_script. The script is materialised only at execution time.
#
# So `run_command("python skills/tabular-automl/scripts/run_automl.py ...")`
# -- what 01_baseline and 02_lean both instructed -- could never work. The
# agent fell back to hand-written LightGBM, which is exactly what a ~0.81
# score looks like against a 0.822 field.
#
# 03_skilled invokes the skill correctly via run_skill_script.
#
# SECOND BUG, found in the same run: skill scripts do not execute with cwd set
# to the sandbox working directory. The harness materialises the skill into its
# own directory and runs `runpy.run_path('scripts/run_automl.py')` from there,
# so `pd.read_csv("train.csv")` raised FileNotFoundError even though
# `run_command("ls -F")` listed train.csv. run_automl.py now locates the data
# directory itself and chdirs into it.
#
# BUDGET NOTE: the earlier theory that the $2 LLM cap caused 01_baseline's 0.812
# was WRONG. A full local session cost ~$0.018 (65k prompt / 967 completion
# tokens at gemini-3.1-flash-lite rates) -- about 1% of the cap. Token budget is
# not the binding constraint; correctness of the skill invocation was.
#
# Model fallbacks if claude-opus-4-5 is unavailable. All multi-tool capable:
#     gemini-3.1-flash-lite   $0.25 / $1.50  (real submission model through v5)
#     qwen3-235b              $0.22 / $0.88
#     deepseek-v3.2           $0.56 / $1.68
# Never use gemini-2.5-* (single tool only) or deepseek-r1-0528 (no tools).
#
# SWITCHED TO OPUS 2026-08-05: v4/v5 (gemini-3.1-flash-lite) both scored
# 0.812 -- flat, as expected, since neither change tested was large enough to
# clear the ~0.010 single-submission noise floor. This agent's job is a
# handful of scripted tool calls with no real reasoning about the data
# (run_skill_script twice, read a CV number, submit), so the orchestrator
# model was never expected to move the score much either way -- this is
# mainly to see whether a stronger model changes turn-taking/tool-call
# reliability, not the model's own "intelligence" about the ML task.
name: skilled_agent
model: claude-opus-4-5
description: Minimal-turn autonomous tabular classifier driving a bundled AutoML skill via run_skill_script.
instruction: !include prompts/system.md

# NOTE: declaring `skills` automatically adds list_skills, load_skill,
# load_skill_resource and run_skill_script to the toolset. write_file is
# declared only so the documented fallback path in the prompt can work.
tools:
  - run_command
  - write_file
  - submit_predictions
  - select_submission
  - get_status

skills:
  - skills/tabular-automl

generate_content_config: !include configs/sampling.yaml
